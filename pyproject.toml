[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nx2dw"
dynamic = ["version"]
description = "Visualize NetworkX graphs as Datawrapper scatterplots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Freyberg" }]
keywords = ["networkx", "datawrapper", "network", "graph", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # forceatlas2_layout, the default layout, was added in networkx 3.4
    "networkx>=3.4",
    # networkx needs numpy for its layout algorithms but doesn't install it itself
    "numpy",
    "requests>=2.0",
]

[project.optional-dependencies]
# only needed for example.py
examples = ["pandas", "python-dotenv", "scipy"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jfreyberg/nx2dw"
Source = "https://github.com/jfreyberg/nx2dw"
Issues = "https://github.com/jfreyberg/nx2dw/issues"

[tool.pytest.ini_options]
filterwarnings = ["ignore:DW_(TEAM|FOLDER)_ID was neither passed:UserWarning"]

[tool.hatch.version]
path = "nx2dw.py"

[tool.hatch.build.targets.wheel]
only-include = ["nx2dw.py"]

[tool.hatch.build.targets.sdist]
only-include = ["nx2dw.py", "tests", "README.md", "LICENSE"]
